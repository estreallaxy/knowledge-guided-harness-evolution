# 初始 Harness H0 配置 —— 赵星源（zhaoXY）
#
# 依据：docs/team-execution-plan.md「代码与 H0」「初始 Harness」两行，
#       以及 harness/README.md。
#
# H0 是四份独立副本的共同起点，原始复现阶段**不修改 H0**；
# 候选只在本人工作区从 H0 派生。标注约定同 terminal-bench-2.0.yaml。

h0:
  name: terminus-kira                                     # [协议]
  upstream: Meta-Harness TB2 参考实现                        # [协议]
  upstream_url: https://github.com/stanford-iris-lab/meta-harness/tree/main/reference_examples/terminal_bench_2

  # ---- 两份副本（必须逐字节一致）----
  personal:
    root: /data1/users/zhaoXY/knowledge-guided-harness-evolution/reproductions/zhaoXY/meta-harness/code/reference_examples/terminal_bench_2
    agent: agents/baseline_kira.py
  shared:
    root: /data1/users/zhaoXY/knowledge-guided-harness-evolution/harness/h0/terminus-kira
    agent: agents/baseline_kira.py
  integrity:                                              # [实测] 2026-10-08 核对
    baseline_kira.py_sha256: e06b9273e2b900006a2072457dff2630ad04e589c48057d050219bdc791eb889
    prompt_sha256: adf2d40a4503965b307d348447f95141aa77db665c6571f3ab9512151894e6f6
    personal_vs_shared: identical
    # 两份副本的 baseline_kira.py 与 prompt 均逐字节一致；四人交叉核对时比对这两个值
    against_head: unmodified    # [实测] 与 git HEAD 的 sha256 一致，未被本地改动

  entry:
    import_path: agents.baseline_kira:AgentHarness        # [协议] harbor --agent 的取值
    prompt: prompt-templates/terminus-kira.txt             # [协议] 由实现相对 agents/ 解析为 ../prompt-templates/
    python: 3.12                                           # [实测] uv 托管的 3.12.14
    run_via: PYTHONPATH=<h0.root>

  # ---- 次要对照 baseline（同样不可写）----
  secondary_baseline:
    name: terminus2
    import_path: agents.baseline_terminus2:AgentHarness
    note: meta_harness.py 的 BASELINES 列表中的第二项；个人 code/ 内有，共享 harness/h0/ 下无

editable_boundary:                                        # [实测] 由 litellm_proposer.py 的白名单在代码层强制
  writable:
    - agents/<候选名>.py
    - prompt-templates/<候选名>.txt
    - logs/pending_eval.json            # 当轮产物，每轮开跑前被删除
  read_only_enforced:
    - agents/baseline_kira.py           # H0 本体，代码层拒绝写入
    - agents/baseline_terminus2.py      # 第二 baseline，同上
    - meta_harness.py
    - scripts/
    - tests/
  outside_boundary:                     # [协议] 任何时候都不属于任务侧 harness
    - benchmark 任务与任务数据
    - 评分器 / verifier
    - 运行器（harbor）
    - 封存测试数据（test 集）
  note: >-
    可写入范围由 litellm_proposer.py 的 write_file 白名单强制，不依赖模型自觉；
    两个 baseline 在代码层面就写不了。

current_state:                                            # [实测] 2026-10-08
  h0_verified: true
  verification: 本地 Docker + deepseek-v4-flash 跑 extract-elf，reward 1.0，$0.168
  derived_candidates_in_worktree:
    # 以下 6 个是 proposer 在沙箱未定期间产出的候选，**不属于 H0**，尚未提交
    - kira_command_telemetry.py
    - kira_completion_fidelity.py
    - kira_completion_telemetry.py
    - kira_exec_state.py
    - kira_shell_return_probe.py
    - kira_verify_gate.py
    # 前两个 ++ 第三个中的 kira_verify_gate 可导入；completion_telemetry 与 exec_state 有语法错误
  prompt_candidates:
    - prompt-templates/terminus-kira-execstate.txt
  note: 候选尚未提交，也未在 benchmark 上评估过（此前全部卡在沙箱后端）
