# H0（起点 harness）配置 —— 王懿
# 版本：2026-10-08
#
# 协议要求（experiments/configs/README.md）：四人的 H0 须**内容一致、路径独立**。
# 本文件记录我这份 H0 的路径与内容指纹，供交叉核对时逐字节比对；
# 其余三人应记录同一份上游内容在各自工作区下的路径与相同指纹。

h0:
  name: kira-baseline
  # 相对 <本工作区>/code/reference_examples/terminal_bench_2/ 的导入路径
  import_path: agents.baseline_kira:AgentHarness
  source: code/reference_examples/terminal_bench_2/agents/baseline_kira.py
  sha256: e06b9273e2b900006a2072457dff2630ad04e589c48057d050219bdc791eb889
  upstream: Meta-Harness 仓库 vendoring 提交 23b053a
  modified_since_vendoring: false   # 自 vendor 起未改动，为纯上游 H0
  base_class: harbor 的 Terminus2（uv 安装的 terminal-bench 0.2.18 提供）

# 备用 baseline（上游 meta_harness.py 的 BASELINES 里同时存在，本轮不作为 H0）：
secondary_baseline:
  name: terminus2-baseline
  import_path: agents.baseline_terminus2:AgentHarness
  used: false

# H0 与后续候选使用完全相同的执行条件，否则与 Meta-Harness 线不可比。
execution:
  model: deepseek/deepseek-flash          # 团队约定 deepseek-v4-flash 对应的端点模型 id
  temperature: 0.7
  api_base_env: HARBOR_API_BASE           # 默认 https://api.deepseek.com/v1
  environment: docker                     # Harbor 内置本地沙箱
  split: train                            # 见 terminal-bench-2.0.yaml
  per_task_timeout_s: 900                 # 各任务 task.toml 的 [agent].timeout_sec
  n_attempts_per_task: 2                  # --trials，与 Meta-Harness 线一致
  concurrency: 50
  # 2026-10-09 实际运行：并发 8（DeepSeek 并发上限随账户余额收紧，50 不可达）。
  # 只影响墙钟时间、不影响单题评分；偏差记录于 notes/environment.md §7，并在本轮 summary 中说明。
  concurrency_actual_20261009: 8

# H0 运行命令（结果写入 experiments/results/<benchmark>/<run_id>/，optimizer 字段为 null）：
#   export HARBOR_DATASET_PATH=/data1/users/wangY/benchmarks/tb2-split-v1/train
#   export HARBOR_TASK_COUNT=30
#   cd code/reference_examples/terminal_bench_2
#   scripts/run_eval.sh agents.baseline_kira:AgentHarness full 2 50
#
# 注意：上游 meta_harness.py 每次运行都会先跑 BASELINES 作为前沿对照（即 H0 结果），
# 与独立的 H0 实验线共用同一入口。两条线的结果目录由 --run-name 区分。
run_entry: scripts/run_eval.sh agents.baseline_kira:AgentHarness full 2 50

results:
  run_id: h0-terminal-bench-2.0-20261009-1
  dir: experiments/results/terminal-bench-2.0/h0-terminal-bench-2.0-20261009-1/
  line: 30 题 pass@2 = 0.70（21 成功 / 8 失败 / 1 未判分）；执行成本 $9.77   # 未判分与偏差说明见 ../notes/environment.md §6/§8
  raw_jobs: reproductions/wangY/meta-harness/runs/jobs/h0-terminal-bench-2.0-20261009-1/

# 待四人确认：H0 实验线是「只跑一次固定 H0」还是「复用 Meta-Harness 循环内的 baseline 结果」。
# 两种做法结果应一致，但目录归属与 run_id 需统一，避免同一结果被记到两条线上。
open_item: baseline-result-ownership
