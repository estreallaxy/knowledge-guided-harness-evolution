[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-safety-eval"
version = "0.1.0"
description = "Research tooling for evaluating CLI-agent safety on real-world harm tasks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.11",
    "openai>=1.0",
    "pexpect>=4.8",
    "requests>=2.28",
    "tqdm>=4.64",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
taxonomy = ["google-genai>=1.0"]
training = ["chz", "datasets", "numpy", "torch"]
dev = [
    "build>=1.2",
    "pytest>=7",
    "pytest-cov>=4",
    "tomli>=2; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/garified/ICML-anchor"

[tool.setuptools]
include-package-data = true
py-modules = ["openrouter_inference"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ablation*",
    "auditor_agent*",
    "auditor_model_training*",
    "baselines*",
    "evaluation_judges*",
    "mcp_tools*",
    "pipeline_statistics*",
    "task_construction*",
    "toolbox_expansion*",
    "trajectory_generation*",
]
exclude = ["sample_data*"]

[tool.setuptools.package-data]
auditor_model_training = ["sft_data/*.json", "sft_data/*.jsonl"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "integration: offline tests spanning multiple modules or subprocesses",
]
