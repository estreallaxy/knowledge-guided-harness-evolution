[project]
name = "aspec"
version = "0.1.0"
description = "Automated Specialization of Agent Systems"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "torch>=2.7.1",
    "numpy==1.26.4",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.2",
    "sentence-transformers>=5.0.0",
    "pydantic>=2.11.7",
    "loguru>=0.7.3",
    "tqdm>=4.67.1",
    "aiofiles>=24.1.0",
    "tenacity>=8.2.3,<9.0.0",
    "python-dotenv>=1.1.1",
    "litellm>=1.76.0",
    "openai>=1.97.0",
    "h5py>=3.14.0",
    "datasets>=4.0.0",
    "tree-sitter>=0.24",
    "tree-sitter-python>=0.23.6",
]

[dependency-groups]
dev = [
    "ruff>=0.12.2",
    "pytest>=7.4.3",
    "mypy>=1.17.0",
    "pyright>=1.1.398",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aspec*"]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable names (common in math code)
    "B028",   # no stacklevel in warnings
    "SIM108", # ternary operator (readability)
]

[tool.ruff.lint.isort]
known-first-party = ["aspec", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
aspec = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }

[tool.pixi.tasks]
