# 闲鱼小法庭多智能体配置文件
# 每个智能体独立决策，通过云雾API调用不同模型

# ==================== API配置 ====================
api:
  # 云雾API配置
  yunwu:
    api_key: ""
    base_url: "https://yunwu.ai/v1"
  
  # 备用：也可以设置环境变量
  # export YUNWU_API_KEY="REDACTED_UPSTREAM_CREDENTIAL"

# ==================== 全局配置 ====================
global:
  output_dir: "./results/court_analysis"
  log_dir: "./logs/court"
  seed: 42

# ==================== 数据配置 ====================
data:
  # dataset_path: "./dataset/val_new_new.json"
  dataset_path: "./dataset/test_new.json"
  # dataset_path: "./dataset/train_new_new.json"
  # dataset_path: "./dataset/test_new.json"
  output_format: "json"  # json, jsonl, csv
  # limit: 10
  
# ==================== 智能体配置 ====================
# 每个智能体独立决策，通过云雾API调用不同模型
ablation_agents:
  # cot_agent_ablation_3lines
  # cot_agent
  # cot_agent_only_prompt
  cot_agent_our_visual
  # cot_agent_our_visual_crop 
  # cot_agent_origin_cot
  # cot_agent_ablation_4lines
  # cot_agent_our_wo_visual

agents:

   # 智能体1: 使用 Gemini Pro Vision
  agent_1:
    name: "智能体1 (Gemini)"
    model_name: "gemini-2.5-flash-lite-nothinking"  # 云雾API模型名称
    enabled: true
    max_iterations_buyer : 3
    max_iterations_seller: 3
    generation_config:
      max_tokens: 4096
      temperature: 0.7
    
    # 重试配置
    retry:
      max_retries: 3      # 最大重试次数
      delay: 2.0          # 初始延迟（秒）
      backoff: 1.0        # 延迟倍增因子

  
  # # 智能体2: 使用 GPT-4 Vision
  # agent_2:
  #   name: "智能体2 (GPT-4V)"
  #   model_name: "gpt-4-vision-preview"  # 云雾API模型名称
  #   enabled: true
    
  #   # 生成参数
  #   generation_config:
  #     max_tokens: 4096
  #     temperature: 0.7
    

  # # 智能体3: 使用 Claude 3 Opus
  # agent_3:
  #   name: "智能体3 (Claude-Opus)"
  #   model_name: "claude-3-opus-20240229"  # 云雾API模型名称
  #   enabled: true
    
  #   generation_config:
  #     max_tokens: 4096
  #     temperature: 0.5
    
    
# ==================== 执行配置 ====================
execution:
  # 所有智能体并行独立决策
  mode: "parallel"  # 并行执行所有智能体
  timeout: 120  # 每个智能体的超时时间（秒）

# ==================== 输出配置 ====================
output:
  # 保存格式
  formats:
    - "json"        # 结构化数据
    - "markdown"    # 人类可读报告
  
  # 可视化配置
  visualization:
    enabled: true
    draw_boxes: true          # 绘制检测框
    box_colors:
      agent_1: "#FF6B6B"    # 红色
      agent_2: "#4ECDC4"    # 青色
      agent_3: "#FFE66D"    # 黄色
    
    box_thickness: 3
    font_size: 16
    save_annotated_images: true
  
  # 结果汇总
  summary:
    include_all_agents: true       # 包含所有智能体的决策
    show_diversity: true           # 展示决策多样性
    consensus_analysis: true       # 分析共识程度

# ==================== 评估配置 ====================
evaluation:
  enabled: false
  ground_truth_file: "./data/ground_truth.json"
  metrics:
    - "accuracy"           # 裁决准确率
    - "box_iou"           # 检测框 IoU
    - "consistency"       # 多模型一致性
    - "reasoning_quality" # 推理质量（人工评估）

# ==================== 其他配置 ====================
logging:
  level: "INFO"
  save_prompts: true
  save_responses: true
  save_timings: true

cache:
  enabled: true
  cache_dir: "./cache/model_outputs"
  ttl: 86400  # 24小时

error_handling:
  retry_times: 3
  retry_delay: 5
  skip_failed_agents: true  # 如果某个智能体失败，继续执行其他智能体


debug_save_crops: true
debug_crops_dir: "./debug_crops"

max_workers: 64

