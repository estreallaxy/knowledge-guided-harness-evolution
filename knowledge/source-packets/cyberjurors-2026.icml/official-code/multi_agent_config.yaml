# 多智能体讨论系统配置
# Multi-Agent Debate System Configuration

# ==================== 案例配置 ====================
resume: true
parallel_cases: 16 # ✅ 增加并行案例数以提升吞吐量（根据机器资源调整）

# ==================== 云雾配置 ====================
api_key: ""
base_url: "https://yunwu.ai/v1"



# ==================== 智能体配置 ====================
num_agents: 17             # 智能体数量
max_epochs: 3               # 最大讨论轮次
# max_workers: 17             # 线程池大小（建议与智能体数量相同）

# ==================== 社交网络配置 ====================
use_social_network: true    # 是否使用社交网络
following_network_path: "./config/following_network_17.json"  # 社交网络配置文件路径
# 如果文件不存在，会自动生成一个随机社交网络

# ==================== CoT 配置 ====================
max_iterations_buyer: 3     # 买方视角最大迭代次数
max_iterations_seller: 3    # 卖方视角最大迭代次数

# ==================== 模型配置 ====================
# 支持两种配置方式：
# 1. 统一模型（所有智能体使用相同模型）
model_name: "gemini-2.5-flash-lite-nothinking"  # 默认模型
max_tokens: 2048            # 最大token数
temperature: 0.7            # 温度参数


# 2. 异构模型（每个智能体使用不同模型）- 可选
# 如果配置了 agent_models，会覆盖上面的统一配置
agent_diff_model: false
agent_models:
  # 格式: agent_id: {model_name, max_tokens, temperature}
  0: "gemini-2.5-flash-lite-nothinking"
  1: "gpt-4o-mini"
  2: "gemini-2.5-flash-lite-nothinking"
  3: "claude-3.5-sonnet"
  4: "gemini-2.5-flash-lite-nothinking"
  5: "gpt-4o-mini"
  6: "gemini-2.5-flash-lite-nothinking"
  7: "claude-3.5-sonnet"
  8: "gemini-2.5-flash-lite-nothinking"
  9: "gpt-4o-mini"
  10: "gemini-2.5-flash-lite-nothinking"
  11: "claude-3.5-sonnet"
  12: "gemini-2.5-flash-lite-nothinking"
  13: "gpt-4o-mini"
  14: "gemini-2.5-flash-lite-nothinking"
  15: "claude-3.5-sonnet"
  16: "gemini-2.5-flash-lite-nothinking"

# ==================== 数据配置 ====================
dataset_path: "D:\\code\\ICML\\code\\test_new.json"  # 数据集路径
output_dir: "./results/multi_agent_debate"   # 输出目录                 
experiment_name: "results"      # 实验名称（用于区分不同实验，结果保存在 output_dir/experiment_name/ 下）

# ==================== 讨论策略配置 ====================
use_social_consensus: true   # 是否使用社会共识
use_mean_field: true         # 是否使用平均场
early_stop_consensus: 0.8    # 达到此共识度时提前停止（0-1）

# ==================== 结果保存配置 ====================
save_all_epochs: true       # 是否保存所有轮次的智能体决策（false=仅保存最后一轮，true=保存所有轮次）
seed: 42                     # 随机种子

