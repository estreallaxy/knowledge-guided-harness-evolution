# Task configuration
max_rounds: 3
expert_info_mode: none  # Options: none, full, single_expert, distributed
interactive_brainstorming_mode: false  # Set to true for interactive brainstorming, false for nominal brainstorming with individual rankings
decision_mode: expert_not_mentioned  # Options: expert_not_mentioned, discussion_based_expert_identification, explicit_expert_voting, worse_than_expert_voting, reveal_expert, reveal_distributed_experts
num_adversarial_agents: 0  # Number of adversarial agents (0 = disabled)
adversarial_mode: none  # Options: none, with_ground_truth, without_ground_truth
randomize_speaking_order: true  # If true, randomize the speaking order in each round. If false, agents speak in fixed order (agent_ids order).
randomize_final_submitter: true  # If true, randomly select a non-adversarial agent to submit the final ranking. If false, always use agent 0 (or first non-adversarial agent).
seed: 42

# W&B configuration
wandb_project: lost-at-sea
wandb_entity: null
wandb_group: null
wandb_tags: null

# Backend configuration - Option 1: Single backend type (all agents use same provider/model)
# Uncomment this section and comment out agent_backends for homogeneous teams
# backend:
#   provider: openai
#   model: gpt-4o-mini
#   temperature: 0.7

# Number of agents when using single backend. Comment this out for mixed backends.
# num_agents: 3

# Backend configuration - Option 2: Mixed backends (heterogeneous teams)
# Uncomment this section and comment out backend + num_agents for mixed teams
agent_backends:
  - provider: openai
    count: 2
    model: gpt-4o-mini
    temperature: 0.7
  - provider: anthropic
    count: 3
    model: claude-3-5-haiku-20241022

# API keys (loaded from environment)
openai_api_key: ${oc.env:OPENAI_API_KEY}
anthropic_api_key: ${oc.env:ANTHROPIC_API_KEY,null}
openrouter_api_key: ${oc.env:OPENROUTER_API_KEY,null}

