# MATH-500 Experiment Configuration

# Experiment Parameters
max_rounds: 4
limit: null  # Default: null (run entire dataset). Set to a number to randomly sample that many problems.
reference_run_name: null  # Default: null. Set to a W&B run name to filter dataset to same unique_ids as that run.
dataset_name: "HuggingFaceH4/MATH-500"
seed: 42

# Decision Mode
# Options: "expert_not_mentioned", "explicit_expert_voting", "reveal_expert"
decision_mode: "expert_not_mentioned"
most_capable_model_name: "gpt-4o-mini"  # Used as fallback for "reveal_expert" (strongest model)

# LLM Fallback for Answer Equivalence Checking
use_llm_fallback: true  # Use LLM as final fallback when symbolic math fails
llm_fallback_model: "gpt-5"  # Model for LLM fallback (e.g., "gpt-4o", "gpt-5")
llm_fallback_api_key: ${oc.env:OPENAI_API_KEY,null}  # API key for LLM fallback

# Backend Configuration
# Option 1: Single backend (all agents use same model)
# Uncomment this section and comment out agent_backends for homogeneous teams
# backend:
#   provider: "openai"
#   model: "gpt-4o"
#   temperature: 0.7
# num_agents: 4

# Option 2: Mixed backends (heterogeneous team) - DEFAULT CONFIGURATION
agent_backends:
  - provider: "openai"
    model: "gpt-4o-mini"
    count: 1
    temperature: 0.7
  - provider: "openai"
    model: "gpt-3.5-turbo-0125"
    count: 1
    temperature: 0.7
  - provider: "anthropic"
    model: "claude-3-5-haiku-20241022"
    count: 1
    temperature: 0.7
  - provider: "anthropic"
    model: "claude-3-haiku-20240307"
    count: 1
    temperature: 0.7

# API Keys (loaded from env vars ideally, but can be overridden here)
openai_api_key: ${oc.env:OPENAI_API_KEY,null}
anthropic_api_key: ${oc.env:ANTHROPIC_API_KEY,null}
openrouter_api_key: ${oc.env:OPENROUTER_API_KEY,null}

# Weights & Biases
wandb_project: "math-500-teamwork"
wandb_entity: null
wandb_group: null
wandb_tags: []

