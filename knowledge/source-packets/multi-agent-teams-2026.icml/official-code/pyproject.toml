[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teamwork"
version = "0.1.0"
description = "Toolkit for experimenting with multi-agent LLM teamwork dynamics"
requires-python = ">=3.9"
dependencies = [
    "openai",
    "anthropic",
    "python-dotenv",
    "hydra-core",
    "wandb",
    "omegaconf",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pyright",
]

[tool.setuptools.packages.find]
include = ["teamwork*"]
exclude = ["experiments*", "tests*"]


[tool.ruff]
extend-exclude = ["*.ipynb"]