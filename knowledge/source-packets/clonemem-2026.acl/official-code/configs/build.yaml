env:
  dotenv_path: ".env"

required_env:
  - NEO4J_URL
  - NEO4J_PASSWORD
  - OPEN_ROUTER_API_KEY

neo4j:
  uri_env: NEO4J_URL
  user: neo4j
  password_env: NEO4J_PASSWORD
  create_constraints: true

llm:
  base_url: "https://openrouter.ai/api/v1"
  api_key_env: OPEN_ROUTER_API_KEY

  build_data:
    model: "anthropic/claude-haiku-4.5"
  build_qa:
    model: "google/gemini-3-flash-preview"

run:
  lang: "zh"
  token_save_dir: "data/runs"
  output_dir: "outputs"   # 根目录


generation:
  start_year: 2022
  duration_years: 1
  num_predefined_events: 2
  num_free_events: 2
  min_bucket_size: 4
  window_interval: 75 # around 2.5 months
  min_new_medias_per_interval: 20
  max_new_medias_per_interval: 50

person:
  person_id: "demo_001"
  display_name: "Lao Shen"
  big_five:
    openness: 0.72
    conscientiousness: 0.38
    extroversion: 0.44
    agreeableness: 0.58
    neuroticism: 0.68
