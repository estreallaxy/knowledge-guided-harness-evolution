[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clonemem"
version = "0.1.0"
description = "CloneMem: Benchmarking Long-Term Memory for AI Clones"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}

dependencies = [
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pydantic>=2.11.7",
    "tiktoken>=0.9.0",
    "openai>=1.109.0",
    "neo4j>=5.28.2",
    "json_repair>=0.25.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "rank_bm25>=0.2.2",
    "scikit-learn>=1.4.0",
]

[project.scripts]
clonemem = "clonemem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clonemem = ["*.yaml", "*.json"]