# name: str
#     model_name: str
#     endpoints: default to null
#         - api_base: str，open-source models are generally deployed with vLLM
#           api_key: str
#     api_type: str
#     tokenizer: str, the HuggingFace name of the model, which needs to be filled in for open source models.
#     parallel: int
#     max_model_len: int


gpt-4o:
    model_name: gpt-4o
    endpoints: 
        - api_base: https://api.gptsapi.net/v1
          api_key: YOUR_API_KEY
    api_type: openai
    parallel: 50
gpt-4:
    model_name: gpt-4
    endpoints: 
        - api_base: https://api.gptsapi.net/v1
        #   api_key: 
          api_key: YOUR_API_KEY
    api_type: openai
    parallel: 1
Qwen2.57B:
    model_name: qwen2.5-7b
    endpoints:
        - api_base: http://localhost:8001/v1
          api_key: EMPTY
    api_type: openai
    parallel: 8
    tokenizer: /data2/models/Qwen2.5-7B-Instruct
    max_model_len: 8192
