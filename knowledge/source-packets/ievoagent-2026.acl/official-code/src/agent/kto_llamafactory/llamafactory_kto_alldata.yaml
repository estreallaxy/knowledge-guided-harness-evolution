### model
model_name_or_path: /data2/models/Qwen2.5-1.5B-Instruct  # 你的基座模型路径

### method
stage: kto
do_train: true
finetuning_type: lora
lora_target: all  # 推荐全模块 LoRA，效果通常比只微调 q_proj,v_proj 好
lora_rank: 32     # 16 或 32 足够，对于 1.5B 模型 16 也可以
lora_alpha: 64
lora_dropout: 0.05

### dataset
dataset: kto_train_0.5  # 对应你在 dataset_info.json 注册的名字
template: qwen           # 确保对应 Qwen 的模板
cutoff_len: 8196         # 根据显存调整，KTO 包含历史记录，长度容易超标
max_samples: 100000
overwrite_cache: false
preprocessing_num_workers: 16

### output
output_dir: ./checkpoints/qwen_kto_v1
logging_steps: 2
save_strategy: epoch
save_total_limit: 5
report_to: wandb
plot_loss: true
overwrite_output_dir: true

### train (关键参数)
per_device_train_batch_size: 2    
gradient_accumulation_steps: 8    
learning_rate: 5.0e-6             
num_train_epochs: 3.0            
lr_scheduler_type: cosine
warmup_ratio: 0.1                 
bf16: true                        
ddp_timeout: 180000000

### kto specific (KTO 特有参数)
pref_beta: 0.1                    # KL 惩罚系数 (Beta)。0.1 是标准值。
                                  # 如果模型变化太小，设为 0.05；如果模型崩坏，设为 0.2
kto_chosen_weight: 1.0            # True 样本的权重 (Desirable)
kto_rejected_weight: 1.0          # False 样本的权重 (Undesirable)
                                  # 如果你的 False 样本特别多，可以把这个降到 0.5-0.7 平衡一下
do_eval: true
per_device_eval_batch_size: 16
eval_dataset: kto_val_0.5
evaluation_strategy: steps
eval_steps: 100

flash_attn: fa2