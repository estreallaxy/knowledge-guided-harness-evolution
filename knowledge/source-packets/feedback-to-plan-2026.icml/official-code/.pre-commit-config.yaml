repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.6
    hooks:
      # Run the linter.
      - id: ruff-check
        exclude: |
          ^($(git config --file .gitmodules --get-regexp path | awk '{print $2}' | tr '\n' '|'))
      # Run the formatter.
      - id: ruff-format
        exclude: |
          ^($(git config --file .gitmodules --get-regexp path | awk '{print $2}' | tr '\n' '|'))

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: "v23.1.0"
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        exclude: |
          ^($(git config --file .gitmodules --get-regexp path | awk '{print $2}' | tr '\n' '|'))
