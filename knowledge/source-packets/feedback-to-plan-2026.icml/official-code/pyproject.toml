[project]
name = "cudanalyst"
version = "0.1.0"
description = "Analysis layer for generation-level interventions in self-evolving LLM agents for CUDA kernel generation, enabling interpretable feedback-to-plan attribution."
readme = "readme.md"
authors = [{ name = "yuxuan-z", email = "yuxuan-z19@qq.com" }]
requires-python = ">=3.10"
dependencies = [
    "grakel>=0.1.11",
    "line-profiler>=5.0.2",
    "nvidia-ml-py>=13.610.43",
    "openai>=3.10.0",
    "pydot>=4.0.1",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.0",
    "tree-sitter-language-pack>=1.16.2",
    "xmltodict>=1.0.4",
]

[project.optional-dependencies]

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pre-commit>=4.6.2"]
