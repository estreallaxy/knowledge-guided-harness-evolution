name: Offline tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,benchmarks]'
      - run: python -m pytest -q
      - run: llm-discussion run --dry-run --dataset data/gsm8k-test.jsonl --limit 2 --output runs/consensus
      - run: llm-discussion run --dry-run --scenario tie --output runs/tie
      - run: llm-discussion run --dry-run --config examples/mixed-models.json --output runs/config
      - run: llm-discussion suite --dry-run --scenario tie --config examples/vision-suite.json --dataset data/gsm8k-test.jsonl --limit 2 --output runs/suite
