[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-discussion"
version = "0.2.0"
description = "Conquer-and-Merge Discussion with OpenRouter and offline dry runs"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
benchmarks = ["pyarrow>=16,<25"]

[project.scripts]
llm-discussion = "llm_discussion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_discussion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
