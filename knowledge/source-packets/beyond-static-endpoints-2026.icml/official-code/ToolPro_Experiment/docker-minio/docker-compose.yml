version: '3.8'

services:
  minio:
    image: quay.io/minio/minio:latest # 使用最新的MinIO镜像
    container_name: minio_server      # 为容器指定一个名字，方便管理
    ports:
      - "9000:9000"  # API端口，用于应用程序连接（如SDK、mc客户端）
      - "9001:9001"  # 控制台端口，用于浏览器访问Web管理界面
    volumes:
      - ./data:/data  # 将当前目录下的data文件夹映射到容器内的/data，用于持久化存储
      - ./config:/root/.minio # 可选：映射配置目录，持久化MinIO配置
    environment:
      - MINIO_ROOT_USER=minioadmin     # 设置默认管理用户名
      - MINIO_ROOT_PASSWORD=minioadmin # 设置默认管理密码
    command: server /data --console-address ":9001" # 运行server命令，并指定控制台端口
    restart: unless-stopped # 设置容器总是重启，除非手动停止（保证服务高可用）
    networks:
      - minio_network # 将服务连接到自定义网络

# 定义一个自定义网络，方便未来扩展其他服务（如NGINX、数据库）
networks:
  minio_network:
    name: minio_network