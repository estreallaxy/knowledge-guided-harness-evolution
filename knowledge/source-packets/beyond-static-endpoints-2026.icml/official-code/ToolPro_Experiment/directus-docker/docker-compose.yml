version: '3.8'
services:
  directus:
    image: directus/directus:latest
    container_name: my-directus-app
    ports:
      - "8055:8055" # 将宿主机的8055端口映射到容器的8055端口
    volumes:
      - ./database:/directus/database # 持久化SQLite数据库
      - ./uploads:/directus/uploads   # 持久化上传的文件
    environment:
      # 以下是最小化的必需环境变量配置
      KEY: "your-super-secret-key-change-this-in-production"
      ADMIN_EMAIL: "admin@example.com"
      ADMIN_PASSWORD: "admin123"
      DB_CLIENT: "sqlite3"            # 使用SQLite
      DB_FILENAME: "/directus/database/data.db"
    restart: unless-stopped