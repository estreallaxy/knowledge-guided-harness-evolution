# EigenShield Default Configuration
# =================================

# Model Settings
model:
  # LLM options: openai-community/gpt2, meta-llama/Llama-3.1-8B-Instruct, 
  #              Qwen/Qwen2.5-7B-Instruct, google/gemma-7b
  # VLM options: llava-hf/llava-1.5-7b-hf, Salesforce/instructblip-vicuna-7b,
  #              Qwen/Qwen2-VL-7B-Instruct, microsoft/Florence-2-large
  name: "openai-community/gpt2"
  type: "llm"  # llm or vlm
  load_in_4bit: false
  load_in_8bit: false
  device: "auto"  # auto, cuda, cpu
  torch_dtype: "float16"  # float16, float32, bfloat16

# Dataset Settings
dataset:
  name: "jailbreak"  # harmbench, rtp, jailbreak
  max_samples: 100
  split: "test"
  min_toxicity: 0.0  # For RTP dataset

# Defense Settings
defense:
  enabled: true
  gamma: 0.75  # Coverage parameter (0.5-0.9)
  noise_estimation: "median"  # median, bulk_fit, tail
  outlier_detection: "bbp"  # bbp, gap
  min_spike_ratio: 1.1
  preserve_norm: true
  
  # RbNS parameters
  rbns:
    n_bootstrap: 50
    bootstrap_ratio: 0.8
    perturbation_scale: 0.01
    n_perturbations: 10
    stability_method: "combined"  # bootstrap, perturbation, combined
  
  # Calibration
  calibration:
    samples: 500
    source: "clean"  # clean, dataset

# Attack Settings (for evaluation)
attack:
  type: "none"  # none, gcg, tap, autobreach, fgsm, pgd, mim, cw, square
  
  # Text attack parameters (GCG, TAP, AutoBreach)
  text:
    num_steps: 100
    batch_size: 512
    suffix_length: 20
  
  # Image attack parameters (FGSM, PGD, MIM, CW, Square)
  image:
    epsilon: 0.031  # 8/255
    alpha: 0.008  # 2/255
    num_steps: 10
    targeted: false

# Evaluation Settings
evaluation:
  use_perspective_api: false
  perspective_api_key: null  # Or set PERSPECTIVE_API_KEY env var
  harm_threshold: 0.5
  batch_size: 8
  max_new_tokens: 256
  temperature: 0.7

# Output Settings
output:
  dir: "./results"
  save_responses: true
  save_adversarial_images: false
  verbose: true
  
# Reproducibility
seed: 42
