# EigenShield Conda Environment


name: eigenshield
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - numpy>=1.24.0
  - scipy>=1.10.0
  - scikit-learn>=1.3.0
  - pillow>=10.0.0
  - tqdm>=4.65.0
  - pyyaml>=6.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - pandas>=2.0.0
  - pip
  - pip:
    - transformers>=4.40.0
    - accelerate>=0.27.0
    - safetensors>=0.4.0
    - datasets>=2.16.0
    - huggingface-hub>=0.20.0
    - einops>=0.7.0
    - sentencepiece>=0.1.99
    - protobuf>=4.21.0
    - google-api-python-client>=2.0.0
    - wandb>=0.16.0
    - tensorboard>=2.15.0
