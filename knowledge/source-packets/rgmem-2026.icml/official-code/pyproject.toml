[project]
name = "l0-memory-system"
version = "0.1.0"
description = "A long-term memory and RAG system for LLMs."
requires-python = ">=3.13"
dependencies = [
    # Web Framework
    "fastapi==0.115.9",
    "uvicorn[standard]==0.34.3",

    # Core AI & LLM Interface
    "dashscope==1.23.4",
    "openai==1.93.0",
    "langchain-core==0.3.67",
    "langchain-community==0.3.25",

    # Data Persistence & State Management
    "elasticsearch==8.14.0",
    "redis==6.2.0",
    "supabase==2.18.0",
    "langchain-neo4j==0.4.0",

    # Data Validation & Schemas
    "pydantic==2.11.7",

    # Utility, Configuration & Foundational
    "python-dotenv==1.1.0",
    "requests==2.32.3",
    "numpy==2.2.6",
    "tqdm==4.67.1",
    "httpx==0.28.1",
    "posthog==4.7.0",
    "pytz==2025.2",
    "tenacity==9.1.2",
]

