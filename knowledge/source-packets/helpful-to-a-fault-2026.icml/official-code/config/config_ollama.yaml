# config/config.yaml — canonical out-of-the-box config (Ollama).
#
# Defaults to Ollama serving Qwen3-4B on the standard port (11434). Larger
# models (qwen3:32b, qwen3:80b, etc.) work the same way; just change the model
# field and make sure the model is pulled with `ollama pull <model>`.
#
# For EPFL RCP cluster runs, see config_rcp.yaml.
# For SGLang runs, see config_sglang.yaml.

attacker:
  provider: "ollama"
  model: "qwen3:4b"
  port: 11434
  temperature: 0.5
  # Qwen3 has a "thinking" mode that emits a large <think> block before the
  # answer. Useful for quality on large models, but for qwen3:4b on a single
  # 12 GB GPU it slows strategy generation dramatically. Leave false by default
  # and flip on for bigger models.
  think: false
  max_retries: 10
  max_turns: 10
  plan_revision: true            # extend unsuccessful plans that ran out of phases
  run_all_strategies: false      # stop at the first successful strategy per behavior
  plans_file: "./strategies/attack_plans.json"
  strategies_per_behavior: 3

target:
  provider: "ollama"
  model: "qwen3:4b"
  port: 11434
  think: false
  temperature: 0
  max_retries: 10
  # In-attack defense. When true, target is initialised with a fixed safety system
  # prompt (see agents/target_model.py). Re-run the attack from scratch to measure
  # its effect; this defense cannot be applied posthoc.
  safety_prompt: false

attack_validation:
  max_tokens_for_evaluation: 512

multithreading:
  max_workers: 1

attack_plan_generator:
  provider: "ollama"
  model: "qwen3:4b"
  port: 11434
  temperature: 0.5
  max_retries: 3
  behavior_path: "./behaviors/agentharm_harmful_behaviors.csv"
  attack_plan_generation_dir: "./strategies"
  progress_dir: "./strategies/progress_new"
  num_behaviors: 176

evaluation:
  use_gpt_judge: true
  judge_provider: "ollama"
  judge_model: "qwen3:4b"
  judge_port: 11434
  require_llm_for_advance: true
  think: false
  semantic_judge:
    provider: "ollama"
    model: "qwen3:4b"
    host: "http://localhost"
    port: 11434
