# config/config_sglang.yaml — example for a local SGLang server.
#
# Start the server first:
#   python -m sglang.launch_server \
#       --model-path Qwen/Qwen3-4B-Instruct-2507 \
#       --port 30000 --host 127.0.0.1
# Then run main.py, generate_attack_plans.py, etc. with `-c config/config_sglang.yaml`.
#
# All three agents (attacker / target / judge) share one SGLang server in this
# example. Split across ports if you have multiple GPUs.

attacker:
  provider: "sglang"
  model: "Qwen/Qwen3-4B-Instruct-2507"
  port: 30000
  temperature: 0.5
  think: true
  max_retries: 10
  max_turns: 10
  plan_revision: true
  run_all_strategies: false
  plans_file: "./strategies/attack_plans.json"
  strategies_per_behavior: 3

target:
  provider: "sglang"
  model: "Qwen/Qwen3-4B-Instruct-2507"
  port: 30000
  think: false
  temperature: 0
  max_retries: 10
  safety_prompt: false

attack_validation:
  max_tokens_for_evaluation: 512

multithreading:
  max_workers: 1

attack_plan_generator:
  provider: "sglang"
  model: "Qwen/Qwen3-4B-Instruct-2507"
  port: 30000
  temperature: 0.5
  max_retries: 3
  behavior_path: "./behaviors/agentharm_harmful_behaviors.csv"
  attack_plan_generation_dir: "./strategies"
  progress_dir: "./strategies/progress_new"
  num_behaviors: 176

evaluation:
  use_gpt_judge: true
  judge_provider: "sglang"
  judge_model: "Qwen/Qwen3-4B-Instruct-2507"
  judge_port: 30000
  require_llm_for_advance: true
  think: true
  semantic_judge:
    provider: "sglang"
    model: "Qwen/Qwen3-4B-Instruct-2507"
    host: "http://localhost"
    port: 30000
