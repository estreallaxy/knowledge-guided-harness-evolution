[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cuarewardbench"
version = "0.4.0"
description = "CUARewardBench: benchmark tools for evaluating reward models on computer-using agents"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
dependencies = [
  "requests",
  "openai",
  "anthropic",
  "pillow",
  "openpyxl",
  "pandas",
]

[tool.setuptools.packages.find]
include = ["cuarewardbench*"]
