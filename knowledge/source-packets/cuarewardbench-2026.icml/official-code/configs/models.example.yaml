# Example public model configs.
# The built-in registry in cuarewardbench/core/model_config.py is already environment-variable driven;
# this file shows the same pattern in YAML form for teams that prefer external config files.
qwen3vl32b_thinking:
  api_type: 3rd_openai
  model: Qwen3-VL-32B-Thinking
  base_url_env: OPENAI_BASE_URL
  api_key_env: OPENAI_API_KEY
  temperature: 0.6
  repetition_penalty: 1.05
  max_tokens: 16384
  timeout: 600
