[project]
name = "lamp"
version = "0.1.0"
description = "LAMP — Long-range Adaptive Memory Propagation (official reference implementation)."
readme = "README.md"
requires-python = ">=3.11,<3.12"

# Runtime dependencies are read from the code's actual imports and pinned to the
# versions used in the reproducibility environment. The environment targets
# CUDA Linux machines (where the experiments run): torch + torchvision come from
# the PyTorch cu121 index and the PyG C++ extensions from the PyG cu121 wheel
# index (prebuilt wheels, no source build). Two packages are installed from
# upstream git revisions (see [tool.uv.sources]).
dependencies = [
    # --- core tensor / graph stack (CUDA 12.1) -----------------------------
    "torch==2.2.2",
    "torchvision==0.17.2",
    "torch-geometric==2.6.1",
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",
    "torch-cluster==1.6.3",
    "torch-spline-conv==1.2.2",
    # --- temporal-graph models / baselines ---------------------------------
    "torch-geometric-temporal",      # custom fork, pinned via [tool.uv.sources]
    "torch-spatiotemporal==0.9.5",   # imported as `tsl`
    "torchdyn==1.0.6",
    "graphesn==0.2.17",
    "pathpy==2.2.0",
    "pathpyg",                       # git revision, pinned via [tool.uv.sources]
    "pip",                           # required: pathpyG imports `pip._vendor.tomli`
    # Lightning 2.6 removed NeptuneLogger, which tsl 0.9.5 imports unconditionally
    # from tsl/experiment/__init__.py; 2.5.6 is the last release that still has it.
    "pytorch-lightning==2.5.6",
    # --- scientific / utility ----------------------------------------------
    "numpy==1.26.4",
    "scipy==1.17.1",
    "networkx==3.6.1",
    "scikit-learn==1.9.0",
    "sympy==1.14.0",
    "matplotlib==3.10.9",
    "tqdm==4.68.0",
    "joblib==1.5.3",
    "psutil==7.2.2",
    "six==1.17.0",
    "pyyaml==6.0.3",
    "huggingface-hub==1.19.0",       # auto-download of the Colored Leaf Counting data
    # --- experiment orchestration / config / logging -----------------------
    "ray==2.55.1",
    "wandb==0.27.1",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
]

[dependency-groups]
dev = [
    "black>=25.0.0",
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

# ---------------------------------------------------------------------------
# uv configuration
# ---------------------------------------------------------------------------
# Resolve/lock for CUDA Linux only. This lets the lockfile be generated from any
# host (incl. macOS) while pinning the Linux/cu121 wheels the experiments use.
[tool.uv]
environments = ["sys_platform == 'linux'"]
# Python 3.11 has no wheels for the original pandas 1.3.5 (which the TGT fork
# pins); bump pandas to a 3.11-compatible release. numpy is held < 2 so it
# matches the torch 2.2.2 / PyG-extension build ABI.
override-dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<2"]

# The TGT fork hard-pins `pandas<=1.3.5` (incompatible with Python 3.11). Its
# metadata is redeclared here without that cap so resolution can use a modern
# pandas; everything else matches the fork's real requirements.
[[tool.uv.dependency-metadata]]
name = "torch-geometric-temporal"
version = "0.54.0"
requires-dist = [
    "decorator==4.4.2",
    "torch",
    "cython",
    "pandas",
    "torch_sparse",
    "torch_scatter",
    "torch_geometric",
    "numpy",
    "networkx",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pyg-cu121"
url = "https://data.pyg.org/whl/torch-2.2.0+cu121.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torch-scatter = { index = "pyg-cu121" }
torch-sparse = { index = "pyg-cu121" }
torch-cluster = { index = "pyg-cu121" }
torch-spline-conv = { index = "pyg-cu121" }
torch-geometric-temporal = { git = "https://github.com/filippo-biondi/pytorch_geometric_temporal.git", rev = "3a71118d0a33ad4c03cfae5406e31307174e6254" }
pathpyg = { git = "https://github.com/pathpy/pathpyG.git", rev = "ca53f401e966db32f72289329e5b67420f989a5e" }

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
# traffic_forecasting/ is standalone, tsl-based traffic code with its own style.
extend-exclude = ["traffic_forecasting"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# TEMPORARY BASELINE: the codebase is not yet type-annotated. These error codes
# are relaxed so `mypy src/` passes today; they will be removed one by one (and
# real annotations added) in the typing/docstrings pass. Do not add new code
# that relies on these being disabled.
disable_error_code = [
    "assignment",
    "arg-type",
    "misc",
    "var-annotated",
    "union-attr",
    "return",
    "return-value",
    "empty-body",
    "override",
    "call-overload",
    "index",
    "attr-defined",
]
