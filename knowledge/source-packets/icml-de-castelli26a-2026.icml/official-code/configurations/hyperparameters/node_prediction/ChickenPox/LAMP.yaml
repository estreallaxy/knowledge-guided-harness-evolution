Model:
  name: LAMP
  hidden_dim: [32, 64, 128]
  L: [1, 3]
  xi: [1.0, 2.0]
  beta: [-1.0, -0.5, 0.1, 0.5, 1.0]
  epsilon: [0.1, 0.15, 0.2, 0.25, 0.3]
  gamma: [0.01, 0.1]
  mu: 1.0
  activation: tanh

Optimizer:
  name: Adam
  learning_rate: [0.01, 0.001]
  weight_decay: 0.0001

Validation:
  monitor: MSE

Override:
  batch_size: [16, 32]
