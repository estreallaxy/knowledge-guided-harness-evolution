Model:
  name: LAMP
  hidden_dim: [32, 64, 128]
  L: [1, 3]
  xi: [1.0, 2.0]
  epsilon: 0.1
  beta: [-0.5, 0.1, 0.5]
  gamma: [0.01, 0.1]
  activation: tanh
  mu: 1.0

Optimizer:
  name: Adam
  learning_rate: [0.01, 0.001]
  weight_decay: 0.0001

Override:
  batch_size: [32, 64]

Validation:
  monitor: RocAuc
