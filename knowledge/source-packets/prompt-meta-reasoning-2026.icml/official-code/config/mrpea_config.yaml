# System Settings
system:
  config_path: "config/"
  memory_dir: "data/memory"

# Task Settings
task:
  task_name: "gsm8k"  # Name of the task to optimize for
  task_file: "config/tasks_simple.yaml"

# OpenAI Client Configuration
openai:
  api_key: ""      # Set to your OpenAI API key or use OPENAI_API_KEY / AZURE_API_KEY env var
  base_url: ""     # Optional: Set to your Azure OpenAI endpoint if using Azure, or leave blank for OpenAI

# Web Search Settings (LinkUp API)
web_search:
  enabled: false                     # Master switch to enable/disable web search
  linkup_api_key: ""              # Set to your LinkUp API key or use LINKUP_API_KEY env var
  max_searches: 2                   # Maximum web searches allowed during entire optimization

# Agent-Specific Configurations
agents:
  meta_reasoning:                 # Used by abstraction and example generation
    model: "gpt-4.1-nano"
    temperature: 0.7
    max_tokens: 1024

  search_query:
    model: "gpt-4.1-nano"
    temperature: 0.3
    max_tokens: 512

  prompt_refinement:
    model: "gpt-4.1-nano"
    temperature: 0.4
    max_tokens: 1024

  evaluation:
    model: "gpt-4.1-nano"
    temperature: 0.2
    max_tokens: 1024

  web_search:
    model: "gpt-4.1-nano"
    temperature: 0.3
    max_tokens: 512

  meta_decision:
    model: "gpt-4.1-nano"
    temperature: 0.4
    max_tokens: 1024

# Optimization Parameters
optimization:
  max_iterations: 10               # Maximum number of optimization iterations
  win_threshold: 3                 # Number of consecutive wins to stop optimization
  current_best_id: 0              # Starting ID for best prompt (usually 0)
  historical_prompt_limit: 3       # Number of top historical prompts to feed into prompt refinement

  # Ranking and Scoring Parameters
  ranking:
    iteration_bonus: 0.1
    decay_factor: 0.9
    base_score: 1.0

# Memory Settings
memory:
  auto_save: true
  max_prompts: 100
  max_knowledge_entries: 50
  max_examples: 20

# Logging Settings
logging:
  level: "INFO"
  log_to_file: false
  log_file: "logs/mrpea.log"

# Output Settings
output:
  results_dir: "data/results"
  export_memory: true
  save_intermediate: true

# Prompt Evaluation Settings (used by evaluation/eval_*.py)
eval:
  model: "gpt-4.1-nano"
  temperature: 0.2
  max_tokens: 1500