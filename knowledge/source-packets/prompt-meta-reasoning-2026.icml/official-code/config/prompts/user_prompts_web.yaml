abstraction:
  template: |
    Analyze the task and produce abstract strategies.

    Task Description: {{task_description}}
    Sample Question: {{sample_question}}
    Existing Knowledge: {{latest_knowledge}}
    
example_generation:
  template: |
    Generate ONE new example based on the provided information:

    Task Description: {{task_description}}

    Strategies: {{strategies}}
    Principles: {{principles}}
    Evaluation Criteria: {{evaluation_criteria}} (use only to ensure alignment, do not copy)
    
    Recent Examples: {{recent_examples}}
    
    External Examples from Web Search:
    {{retrieved_information}}
    
    IMPORTANT: If web search results contain specific examples relevant to the task, 
    use them as inspiration while creating a new, unique example. Transform external 
    examples to fit the current task context while maintaining their effective patterns.
    
prompt_refinement:
  template: |
    Refine the current best prompt using the provided task context, knowledge, feedback and historical prompts.

    Task Context:
    - Description: {{task_description}}
    - Example: {{latest_example}}
    - Evaluation Criteria: {{latest_criteria}}

    Knowledge Memory:
    - Strategies: {{latest_strategies}}
    - Principles: {{latest_principles}}

    External Knowledge from Web Search:
    {{retrieved_information}}

    IMPORTANT: If web search results contain specific examples, patterns, or techniques relevant to the task, 
    incorporate them directly into the refined prompt. Pay special attention to:
    - Concrete examples that demonstrate effective approaches
    - Specific techniques or patterns that can be applied
    - Best practices that should be followed
    - Common mistakes to avoid

    Feedback from Previous Iterations:
    {{latest_feedback}}

    Historical Context (for reference):
    {{historical_prompts_with_scores}}

    Generate a refined prompt that leverages all available knowledge, especially incorporating 
    relevant examples and techniques from web search results when available.


evaluation:
  template: |
    Compare two prompts and their outputs.

    Test Question: {{question}}
    Reference Answer: 
    - answer: {{answer}}
    - rationale: {{rationale}}
    - skills: {{skills}}

    Prompt 1: {{prompt_1}}
    Answer 1: {{output_1}}

    Prompt 2: {{prompt_2}}
    Answer 2: {{output_2}}

    Evaluation Criteria: {{criteria}}

web_search:
  template: |
    Identify the MOST IMPORTANT search query to fill knowledge gaps for the following task:

    Task Description: {{task_description}}

    Knowledge Gaps (Gap Hypotheses):
    {{gap_hypotheses}}

    Select the single most critical knowledge gap and generate ONE specific search query that would have the highest impact on improving task performance.

meta_decision:
  template: |
    Decide whether web search is needed for this task optimization iteration:

    Task Description: {{task_description}}

    Current Knowledge State:
    {{current_knowledge}}

    Iteration Context:
    - Current iteration: {{iteration}}
    - Remaining web searches: {{remaining_searches}}

    Analyze whether external web search would significantly benefit the current optimization process. Consider the knowledge completeness, task relevance, timing, and potential impact vs. resource cost.


